[package]
name = "chromium-gamma-patcher"
version = "0.1.1"
edition = "2021"
description = "Universal Chromium/Electron font gamma+contrast binary patcher with an egui GUI"
license = "GPL-3.0-only"

[dependencies]
eframe = "0.33"
egui = "0.33"
sha2 = "0.10"
# decoding the bundled keygen artwork (embedded at compile time)
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }

[profile.release]
opt-level = 2
