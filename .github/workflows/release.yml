name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: existing tag to publish
        required: true

permissions:
  contents: write

jobs:
  release:
    # against oldest supported glibc
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - name: Rust
        run: rustup update stable && rustup default stable

      - uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Test
        run: cargo test --locked

      - name: Build
        run: cargo build --release --locked

      - name: Check the artifact
        run: |
          BIN=target/release/chromium-gamma-patcher
          getconf GNU_LIBC_VERSION
          file "$BIN"
          # App loads Wayland/X11/EGL with
          # dlopen, statically linked cannot do that.
          if ! ldd "$BIN" | grep -q 'libc\.so'; then
            echo "::error::not a dynamically linked glibc binary - the window would fail to start"
            exit 1
          fi
          "$BIN" --help

      - name: Package
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NAME="chromium-gamma-patcher-$TAG-x86_64-linux"
          mkdir -p "dist/$NAME"
          cp target/release/chromium-gamma-patcher "dist/$NAME/"
          cp README.md LICENSE assets/NOTICE.md "dist/$NAME/"
          tar -C dist -czf "dist/$NAME.tar.gz" "$NAME"
          cd dist
          sha256sum "$NAME.tar.gz" > "$NAME.tar.gz.sha256"
          cat "$NAME.tar.gz.sha256"

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.event.inputs.tag || github.ref_name }}"
          NOTES="glibc 2.35 or newer (Ubuntu 22.04+, Debian 12+, Fedora 36+)"
          gh release create "$TAG" \
            dist/*.tar.gz \
            dist/*.tar.gz.sha256 \
            --title "$TAG" \
            --notes "$NOTES"
